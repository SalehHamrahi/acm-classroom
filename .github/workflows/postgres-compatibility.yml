name: PostgreSQL compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  postgres-compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acm_classroom
          POSTGRES_PASSWORD: acm_ci_password_64_characters_long_1234567890abcdef
          POSTGRES_DB: acm_classroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acm_classroom -d acm_classroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://acm_classroom:acm_ci_password_64_characters_long_1234567890abcdef@127.0.0.1:5432/acm_classroom?sslmode=disable
      TEST_DATABASE_URL: postgresql://acm_classroom:acm_ci_password_64_characters_long_1234567890abcdef@127.0.0.1:5432/acm_classroom_test?sslmode=disable
      PG_POOL_MAX: 10
      PG_DUMP_BIN: pg_dump
      PG_RESTORE_BIN: pg_restore
      BACKUP_DIR: /tmp/acm-classroom-ci-backups
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
      - name: Run unit and static tests
        run: npm test
      - name: Create isolated PostgreSQL test database
        env:
          PGPASSWORD: acm_ci_password_64_characters_long_1234567890abcdef
        run: createdb -h 127.0.0.1 -U acm_classroom acm_classroom_test
      - name: Run every API fixture against real PostgreSQL 16
        run: npm run test:postgres
      - name: Build production frontend
        run: npm run build
